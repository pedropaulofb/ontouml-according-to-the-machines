name: Scheduled check-agent signal collector

run-name: Scheduled check-agent signal collector (${{ github.event_name }})

"on":
  schedule:
    # Every 20 minutes, UTC. Offset away from minute 00 to reduce scheduler contention.
    - cron: "7,27,47 * * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Issue-manager mode for manual runs. Use dry-run for smoke tests; scheduled runs still post."
        type: choice
        required: true
        default: dry-run
        options:
          - generate
          - dry-run
          - post

      provider:
        description: "Fallback single-provider adapter, used only when provider_model_specs is empty."
        type: choice
        required: true
        default: groq
        options:
          - groq
          - cerebras
          - sambanova
          - gemini
          - openrouter

      provider_model_specs:
        description: "Primary rotation list. Comma-separated provider:model values. Leave default to use the full rotation."
        type: string
        required: false
        default: "groq:llama-3.3-70b-versatile,cerebras:gpt-oss-120b,sambanova:DeepSeek-V3.1,openrouter:nvidia/nemotron-3-ultra-550b-a55b:free,gemini:gemini-3.1-flash-lite,cerebras:zai-glm-4.7,sambanova:Meta-Llama-3.3-70B-Instruct,openrouter:poolside/laguna-m.1:free"

      selection:
        description: "How to select triples. Keep rotate for normal manual and scheduled signal collection."
        type: choice
        required: true
        default: rotate
        options:
          - rotate
          - first

      rotation_seed:
        description: "Fallback runner rotation seed. Ignored when provider_model_specs rotation_index is explicit."
        type: choice
        required: true
        default: hourly
        options:
          - hourly
          - daily

      rotation_index:
        description: "Optional provider/model slot override: 0=Groq Llama, 1=Cerebras GPT-OSS, 2=SambaNova DeepSeek, 3=OpenRouter Nemotron, 4=Gemini, 5=Cerebras GLM, 6=SambaNova Llama, 7=OpenRouter Laguna."
        type: string
        required: false
        default: ""

      pages:
        description: "Optional comma- or newline-separated page list for manual smoke tests. Empty means all canonical stereotype pages."
        type: string
        required: false
        default: ""

      agents:
        description: "Comma-separated check-agent slugs."
        type: string
        required: true
        default: "page-hygiene-checker,language-style-checker"

      models:
        description: "Fallback comma-separated models, used only when provider_model_specs is empty."
        type: string
        required: true
        default: "llama-3.3-70b-versatile"

      max_runs:
        description: "Maximum number of selected triples to run. Use 1 for rotating scheduled collection."
        type: string
        required: true
        default: "1"

      sleep_seconds:
        description: "Seconds to sleep between selected triples."
        type: string
        required: true
        default: "0"

      max_completion_tokens:
        description: "Optional provider completion-token cap. Leave empty to use provider-specific workflow defaults."
        type: string
        required: false
        default: ""

      update_model_statistics:
        description: "Update the cumulative model-run statistics Markdown page. Scheduled runs always update it."
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  issues: write

jobs:
  collect-check-agent-signal:
    name: Collect rotating check-agent signal
    runs-on: ubuntu-latest

    concurrency:
      group: check-agent-signal-collector-${{ github.ref }}
      cancel-in-progress: false

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ github.token }}

      WORKFLOW_MODE: ${{ github.event.inputs.mode }}
      WORKFLOW_PROVIDER: ${{ github.event.inputs.provider }}
      WORKFLOW_PROVIDER_MODEL_SPECS: ${{ github.event.inputs.provider_model_specs }}
      WORKFLOW_SELECTION: ${{ github.event.inputs.selection }}
      WORKFLOW_ROTATION_SEED: ${{ github.event.inputs.rotation_seed }}
      WORKFLOW_ROTATION_INDEX: ${{ github.event.inputs.rotation_index }}
      WORKFLOW_PAGES: ${{ github.event.inputs.pages }}
      WORKFLOW_AGENTS: ${{ github.event.inputs.agents }}
      WORKFLOW_MODELS: ${{ github.event.inputs.models }}
      WORKFLOW_MAX_RUNS: ${{ github.event.inputs.max_runs }}
      WORKFLOW_SLEEP_SECONDS: ${{ github.event.inputs.sleep_seconds }}
      WORKFLOW_MAX_COMPLETION_TOKENS: ${{ github.event.inputs.max_completion_tokens }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Show runtime context
        shell: bash
        run: |
          set -euo pipefail

          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Ref: ${GITHUB_REF}"
          echo "SHA: ${GITHUB_SHA}"

          python --version
          python - <<'PY'
          from importlib import metadata

          for package in ("groq", "google-genai", "openai"):
              try:
                  version = metadata.version(package)
              except metadata.PackageNotFoundError:
                  version = "not installed"
              print(f"{package}=={version}")
          PY

      - name: Validate required secrets and tools
        shell: bash
        run: |
          set -euo pipefail

          trim() {
            printf '%s' "$1" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }

          is_allowed_openrouter_model() {
            case "$1" in
              nvidia/nemotron-3-ultra-550b-a55b:free|poolside/laguna-m.1:free) return 0 ;;
              *) return 1 ;;
            esac
          }

          default_periodic_provider_model_specs="groq:llama-3.3-70b-versatile,cerebras:gpt-oss-120b,sambanova:DeepSeek-V3.1,openrouter:nvidia/nemotron-3-ultra-550b-a55b:free,gemini:gemini-3.1-flash-lite,cerebras:zai-glm-4.7,sambanova:Meta-Llama-3.3-70B-Instruct,openrouter:poolside/laguna-m.1:free"

          provider="${WORKFLOW_PROVIDER:-groq}"
          provider_model_specs="${WORKFLOW_PROVIDER_MODEL_SPECS:-}"

          if [[ -z "$provider_model_specs" && "${GITHUB_EVENT_NAME:-}" == "schedule" ]]; then
            provider_model_specs="$default_periodic_provider_model_specs"
          fi

          uses_groq=false
          uses_gemini=false
          uses_cerebras=false
          uses_sambanova=false
          uses_openrouter=false

          if [[ -n "$provider_model_specs" ]]; then
            IFS=',' read -ra specs <<< "$provider_model_specs"
            for spec in "${specs[@]}"; do
              spec="$(trim "$spec")"
              if [[ -z "$spec" ]]; then
                continue
              fi
              if [[ "$spec" != *:* ]]; then
                echo "::error::Invalid provider:model spec: ${spec}"
                exit 1
              fi
              spec_provider="$(trim "${spec%%:*}")"
              spec_model="$(trim "${spec#*:}")"
              case "$spec_provider" in
                groq) uses_groq=true ;;
                gemini) uses_gemini=true ;;
                cerebras) uses_cerebras=true ;;
                sambanova) uses_sambanova=true ;;
                openrouter)
                  uses_openrouter=true
                  if ! is_allowed_openrouter_model "$spec_model"; then
                    echo "::error::Unsupported OpenRouter model in provider_model_specs: ${spec_model}. Use only :free OpenRouter model IDs configured for this workflow."
                    exit 1
                  fi
                  ;;
                *)
                  echo "::error::Unsupported provider in provider_model_specs: ${spec_provider}"
                  exit 1
                  ;;
              esac
            done
          else
            case "$provider" in
              groq) uses_groq=true ;;
              gemini) uses_gemini=true ;;
              cerebras) uses_cerebras=true ;;
              sambanova) uses_sambanova=true ;;
              openrouter) uses_openrouter=true ;;
              *)
                echo "::error::Unsupported provider: ${provider}"
                exit 1
                ;;
            esac
          fi

          if [[ "$uses_groq" == "true" && -z "${GROQ_API_KEY:-}" ]]; then
            echo "::error::Missing required repository secret: GROQ_API_KEY"
            exit 1
          fi
          if [[ "$uses_gemini" == "true" && -z "${GEMINI_API_KEY:-}" ]]; then
            echo "::error::Missing required repository secret: GEMINI_API_KEY"
            exit 1
          fi
          if [[ "$uses_cerebras" == "true" && -z "${CEREBRAS_API_KEY:-}" ]]; then
            echo "::error::Missing required repository secret: CEREBRAS_API_KEY"
            exit 1
          fi
          if [[ "$uses_sambanova" == "true" && -z "${SAMBANOVA_API_KEY:-}" ]]; then
            echo "::error::Missing required repository secret: SAMBANOVA_API_KEY"
            exit 1
          fi
          if [[ "$uses_openrouter" == "true" && -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo "::error::Missing required repository secret: OPENROUTER_API_KEY"
            exit 1
          fi

          gh --version
          gh auth status

      - name: Compile signal scripts
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            scripts/phase-2/run_check_agent.py \
            scripts/phase-2/run_check_batch.py \
            scripts/phase-2/update_model_run_statistics.py \
            scripts/phase-2/issue_manager.py \
            scripts/phase-2/providers/openai_compatible.py \
            scripts/phase-2/providers/groq.py \
            scripts/phase-2/providers/gemini.py \
            scripts/phase-2/providers/cerebras.py \
            scripts/phase-2/providers/sambanova.py \
            scripts/phase-2/providers/openrouter.py

      - name: Run check-agent signal collector
        shell: bash
        run: |
          set -euo pipefail

          trim() {
            printf '%s' "$1" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }

          is_allowed_openrouter_model() {
            case "$1" in
              nvidia/nemotron-3-ultra-550b-a55b:free|poolside/laguna-m.1:free) return 0 ;;
              *) return 1 ;;
            esac
          }

          default_groq_models="llama-3.3-70b-versatile"
          default_periodic_provider_model_specs="groq:llama-3.3-70b-versatile,cerebras:gpt-oss-120b,sambanova:DeepSeek-V3.1,openrouter:nvidia/nemotron-3-ultra-550b-a55b:free,gemini:gemini-3.1-flash-lite,cerebras:zai-glm-4.7,sambanova:Meta-Llama-3.3-70B-Instruct,openrouter:poolside/laguna-m.1:free"

          mode="${WORKFLOW_MODE:-post}"
          provider="${WORKFLOW_PROVIDER:-groq}"
          provider_model_specs="${WORKFLOW_PROVIDER_MODEL_SPECS:-}"
          selection="${WORKFLOW_SELECTION:-rotate}"
          rotation_seed="${WORKFLOW_ROTATION_SEED:-hourly}"
          rotation_index="${WORKFLOW_ROTATION_INDEX:-}"
          pages_input="${WORKFLOW_PAGES:-}"
          agents_input="${WORKFLOW_AGENTS:-page-hygiene-checker,language-style-checker}"
          models_input="${WORKFLOW_MODELS:-$default_groq_models}"
          max_runs="${WORKFLOW_MAX_RUNS:-1}"
          sleep_seconds="${WORKFLOW_SLEEP_SECONDS:-0}"
          max_completion_tokens="${WORKFLOW_MAX_COMPLETION_TOKENS:-}"

          if [[ -z "$provider_model_specs" && "${GITHUB_EVENT_NAME:-}" == "schedule" ]]; then
            provider_model_specs="$default_periodic_provider_model_specs"
          fi

          if [[ -z "$rotation_index" && "$selection" == "rotate" && -n "$provider_model_specs" ]]; then
            # Align provider:model rotation buckets with the cron schedule:
            # 7,27,47 * * * *
            #
            # Without this offset, delayed runs near :20 or :40 can cross into the
            # next Unix-anchored 20-minute bucket and select the next model slot.
            rotation_period_seconds=1200
            rotation_schedule_offset_seconds=420
            rotation_timestamp="$(date -u +%s)"

            rotation_index="$(( (rotation_timestamp - rotation_schedule_offset_seconds) / rotation_period_seconds ))"

            echo "Rotation timestamp UTC: $(date -u --date="@${rotation_timestamp}" '+%Y-%m-%dT%H:%M:%SZ')"
            echo "Raw provider/model rotation index: ${rotation_index}"
          fi

          if [[ -n "$provider_model_specs" ]]; then
            provider_model_specs_normalized="${provider_model_specs//$'\n'/,}"
            IFS=',' read -ra provider_model_specs_array <<< "$provider_model_specs_normalized"

            normalized_specs=()
            for spec in "${provider_model_specs_array[@]}"; do
              spec="$(trim "$spec")"
              if [[ -n "$spec" ]]; then
                normalized_specs+=("$spec")
              fi
            done

            if [[ "${#normalized_specs[@]}" -eq 0 ]]; then
              echo "::error::provider_model_specs was provided but no usable provider:model spec was found."
              exit 1
            fi

            provider_model_index=0
            runner_rotation_index="$rotation_index"

            if [[ "$selection" == "rotate" && -n "$rotation_index" ]]; then
              provider_model_index="$((rotation_index % ${#normalized_specs[@]}))"
              runner_rotation_index="$((rotation_index / ${#normalized_specs[@]}))"
            fi

            selected_provider_model_spec="${normalized_specs[$provider_model_index]}"
            if [[ "$selected_provider_model_spec" != *:* ]]; then
              echo "::error::Invalid provider:model spec: ${selected_provider_model_spec}"
              exit 1
            fi

            provider="$(trim "${selected_provider_model_spec%%:*}")"
            models_input="$(trim "${selected_provider_model_spec#*:}")"
            rotation_index="$runner_rotation_index"

            if [[ "$provider" == "openrouter" ]] && ! is_allowed_openrouter_model "$models_input"; then
              echo "::error::Unsupported OpenRouter model in selected provider_model_specs slot: ${models_input}. Use only :free OpenRouter model IDs configured for this workflow."
              exit 1
            fi

          echo "Provider/model rotation specs: ${normalized_specs[*]}"
          echo "Provider/model slot count: ${#normalized_specs[@]}"
          echo "Provider/model slot index: ${provider_model_index}"
          echo "Runner rotation index: ${runner_rotation_index}"
          echo "Selected provider/model spec: ${selected_provider_model_spec}"
          elif [[ "$provider" == "gemini" && "$models_input" == "$default_groq_models" ]]; then
            echo "Provider is gemini and Groq default models were supplied; using gemini-3.1-flash-lite."
            models_input="gemini-3.1-flash-lite"
          elif [[ "$provider" == "openrouter" && "$models_input" == "$default_groq_models" ]]; then
            echo "Provider is openrouter and Groq default models were supplied; using nvidia/nemotron-3-ultra-550b-a55b:free."
            models_input="nvidia/nemotron-3-ultra-550b-a55b:free"
          fi

          if [[ -z "$max_completion_tokens" && "$provider" == "groq" && "$models_input" == "openai/gpt-oss-20b" ]]; then
            max_completion_tokens="1400"
          fi

          if [[ -z "$max_completion_tokens" ]]; then
            max_completion_tokens="3000"
          fi

          page_args=()
          if [[ -n "$pages_input" ]]; then
            pages_normalized="${pages_input//,/$'\n'}"
            while IFS= read -r page; do
              page="$(trim "$page")"
              if [[ -n "$page" ]]; then
                page_args+=(--page "$page")
              fi
            done <<< "$pages_normalized"
          else
            page_args+=(--pages-glob "docs/stereotypes/classes/*.md")
            page_args+=(--pages-glob "docs/stereotypes/relations/*.md")
            page_args+=(--exclude-pages-glob "docs/stereotypes/**/index.md")
          fi

          agent_args=()
          IFS=',' read -ra agents <<< "$agents_input"
          for agent in "${agents[@]}"; do
            agent="$(trim "$agent")"
            if [[ -n "$agent" ]]; then
              agent_args+=(--agent "$agent")
            fi
          done

          model_args=()
          IFS=',' read -ra models <<< "$models_input"
          for model in "${models[@]}"; do
            model="$(trim "$model")"
            if [[ -n "$model" ]]; then
              if [[ "$provider" == "openrouter" ]] && ! is_allowed_openrouter_model "$model"; then
                echo "::error::Unsupported OpenRouter model: ${model}. Use only :free OpenRouter model IDs configured for this workflow."
                exit 1
              fi
              model_args+=(--model "$model")
            fi
          done

          rotation_args=()
          if [[ -n "$rotation_index" ]]; then
            rotation_args+=(--rotation-index "$rotation_index")
          fi

          completion_args=()
          if [[ -n "$max_completion_tokens" ]]; then
            completion_args+=(--max-completion-tokens "$max_completion_tokens")
          fi

          echo "Mode: ${mode}"
          echo "Provider: ${provider}"
          echo "Models: ${models_input}"
          echo "Selection: ${selection}"
          echo "Rotation seed: ${rotation_seed}"
          echo "Rotation index: ${rotation_index:-n/a}"
          echo "Max runs: ${max_runs}"
          echo "Sleep seconds: ${sleep_seconds}"
          echo "Max completion tokens: ${max_completion_tokens:-default}"

          python scripts/phase-2/run_check_batch.py \
            "${page_args[@]}" \
            "${agent_args[@]}" \
            --provider "$provider" \
            "${model_args[@]}" \
            --mode "$mode" \
            --repo "$GITHUB_REPOSITORY" \
            --selection "$selection" \
            --rotation-seed "$rotation_seed" \
            "${rotation_args[@]}" \
            --max-runs "$max_runs" \
            --sleep-seconds "$sleep_seconds" \
            "${completion_args[@]}" \
            --allow-rejected-check-outputs \
            --allow-provider-failures

      - name: Update model run statistics page
        id: model_statistics
        if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.update_model_statistics == 'true') }}
        shell: bash
        run: |
          set -euo pipefail

          # Refresh the target branch before reading and rewriting the persistent
          # Markdown counter page. Workflow-level concurrency reduces overlap
          # between scheduled runs, but this also avoids starting from stale
          # statistics when another commit reached the branch first.
          git pull --ff-only origin "${GITHUB_REF_NAME}"

          if [[ ! -f .tmp/phase-2/batch-summary.md ]]; then
            echo "::warning::No batch summary found; skipping model run statistics update."
            exit 0
          fi

          default_periodic_provider_model_specs="groq:llama-3.3-70b-versatile,cerebras:gpt-oss-120b,sambanova:DeepSeek-V3.1,openrouter:nvidia/nemotron-3-ultra-550b-a55b:free,gemini:gemini-3.1-flash-lite,cerebras:zai-glm-4.7,sambanova:Meta-Llama-3.3-70B-Instruct,openrouter:poolside/laguna-m.1:free"
          provider_model_specs="${WORKFLOW_PROVIDER_MODEL_SPECS:-}"

          if [[ -z "$provider_model_specs" && "${GITHUB_EVENT_NAME:-}" == "schedule" ]]; then
            provider_model_specs="$default_periodic_provider_model_specs"
          fi
          if [[ -z "$provider_model_specs" ]]; then
            provider_model_specs="${WORKFLOW_PROVIDER:-groq}:${WORKFLOW_MODELS:-llama-3.3-70b-versatile}"
          fi

          python scripts/phase-2/update_model_run_statistics.py \
            --summary .tmp/phase-2/batch-summary.md \
            --statistics-page docs/methodology/phases/phase-2/model-run-statistics.md \
            --provider-model-specs "$provider_model_specs" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow "$GITHUB_WORKFLOW" \
            --event-name "$GITHUB_EVENT_NAME" \
            --commit-sha "$GITHUB_SHA"

      - name: Commit model run statistics page
        if: ${{ always() && steps.model_statistics.outcome == 'success' && (github.event_name == 'schedule' || github.event.inputs.update_model_statistics == 'true') }}
        shell: bash
        run: |
          set -euo pipefail

          git add docs/methodology/phases/phase-2/model-run-statistics.md
          if git diff --cached --quiet; then
            echo "No model run statistics changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update check-agent model run statistics"
          git push origin HEAD:"${GITHUB_REF_NAME}"

      - name: Upload check-agent artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-agent-signal-collector-${{ github.run_id }}
          path: .tmp/phase-2
          if-no-files-found: warn
          retention-days: 90
