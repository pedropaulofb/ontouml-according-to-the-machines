name: Scheduled check-agent signal collector

run-name: Scheduled check-agent signal collector (${{ github.event_name }})

"on":
  schedule:
    # Every 20 minutes, UTC. Each trigger is a useful-work scheduling opportunity.
    - cron: "7,27,47 * * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Queue mode, or an explicit diagnostic provider-call mode."
        type: choice
        required: true
        default: plan
        options:
          - plan
          - simulate
          - generate
          - dry-run
          - post

      provider:
        description: "Provider for explicit generate/dry-run diagnostics."
        type: choice
        required: true
        default: groq
        options:
          - groq
          - sambanova
          - gemini
          - openrouter

      provider_model_specs:
        description: "Optional comma-separated provider:model queue filter."
        type: string
        required: false
        default: ""

      pages:
        description: "Optional comma- or newline-separated page filter; required for provider-call diagnostics."
        type: string
        required: false
        default: ""

      agents:
        description: "Comma-separated check-agent slugs; explicit diagnostics require at least one."
        type: string
        required: false
        default: "page-hygiene-checker,language-style-checker"

      models:
        description: "Comma-separated models for explicit generate/dry-run diagnostics."
        type: string
        required: false
        default: ""

      max_tasks_per_provider:
        description: "Optional queue planning bound per provider; 0 means no fixed task-count limit."
        type: string
        required: true
        default: "0"

      execution_budget_seconds:
        description: "Provider execution budget before deterministic aggregation/persistence reserve."
        type: string
        required: true
        default: "720"

      max_completion_tokens:
        description: "Optional completion-token cap for explicit provider-call diagnostics."
        type: string
        required: false
        default: ""

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: phase-2-signal-collector-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Explicit provider-call diagnostic
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'generate' || github.event.inputs.mode == 'dry-run') }}
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      PHASE2_QUOTA_EVENT_DIR: .tmp/phase-2/quota-events
      PHASE2_CALL_SOURCE: signal

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate and run explicit diagnostic
        shell: bash
        env:
          MODE_INPUT: ${{ github.event.inputs.mode }}
          PROVIDER_INPUT: ${{ github.event.inputs.provider }}
          PAGES_INPUT: ${{ github.event.inputs.pages }}
          AGENTS_INPUT: ${{ github.event.inputs.agents }}
          MODELS_INPUT: ${{ github.event.inputs.models }}
          MAX_COMPLETION_TOKENS_INPUT: ${{ github.event.inputs.max_completion_tokens }}
        run: |
          set -euo pipefail

          if [[ -z "${PAGES_INPUT//[[:space:],]/}" || -z "${AGENTS_INPUT//[[:space:],]/}" || -z "${MODELS_INPUT//[[:space:],]/}" ]]; then
            echo "::error::generate and dry-run diagnostics require explicit pages, agents, provider, and models."
            exit 1
          fi

          python scripts/phase-2/provider_model_registry.py validate

          page_args=()
          while IFS= read -r page; do
            [[ -n "$page" ]] && page_args+=(--page "$page")
          done < <(printf '%s' "$PAGES_INPUT" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d')

          agent_args=()
          while IFS= read -r agent; do
            [[ -n "$agent" ]] && agent_args+=(--agent "$agent")
          done < <(printf '%s' "$AGENTS_INPUT" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d')

          model_args=()
          spec_args=()
          while IFS= read -r model; do
            if [[ -n "$model" ]]; then
              model_args+=(--model "$model")
              spec_args+=("${PROVIDER_INPUT}:${model}")
            fi
          done < <(printf '%s' "$MODELS_INPUT" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d')
          specs="$(IFS=','; printf '%s' "${spec_args[*]}")"
          python scripts/phase-2/provider_model_registry.py validate-specs --specs "$specs"

          completion_args=()
          [[ -n "$MAX_COMPLETION_TOKENS_INPUT" ]] && completion_args+=(--max-completion-tokens "$MAX_COMPLETION_TOKENS_INPUT")

          python scripts/phase-2/run_check_batch.py \
            "${page_args[@]}" \
            "${agent_args[@]}" \
            --provider "$PROVIDER_INPUT" \
            "${model_args[@]}" \
            --mode "$MODE_INPUT" \
            --repo "$GITHUB_REPOSITORY" \
            --selection first \
            --sleep-seconds 0 \
            "${completion_args[@]}" \
            --allow-rejected-check-outputs \
            --allow-provider-failures

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-2-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/phase-2/batch
            .tmp/phase-2/batch-summary.md
            .tmp/phase-2/quota-events
          if-no-files-found: ignore

  persist-diagnostic-quota:
    name: Persist diagnostic quota observations
    if: ${{ always() && needs.diagnostic.result != 'skipped' }}
    needs: diagnostic
    runs-on: ubuntu-latest
    concurrency:
      group: phase-2-operational-state-write
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download diagnostic artifacts
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: phase-2-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/phase-2/diagnostic-artifact

      - name: Aggregate and push diagnostic quota state
        shell: bash
        env:
          PHASE2_AUTOMATION_TOKEN: ${{ secrets.PHASE2_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail

          event_root="$PWD/.tmp/phase-2/diagnostic-artifact/quota-events"
          if ! compgen -G "${event_root}/*.json" > /dev/null; then
            echo "No diagnostic quota observation events found."
            exit 0
          fi
          if [[ -z "${PHASE2_AUTOMATION_TOKEN:-}" ]]; then
            echo "::error::Missing required repository secret: PHASE2_AUTOMATION_TOKEN"
            exit 1
          fi
          echo "::add-mask::${PHASE2_AUTOMATION_TOKEN}"

          worktree_root="$(mktemp -d)"
          push_url="https://x-access-token:${PHASE2_AUTOMATION_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          trap 'git worktree prune; rm -rf "$worktree_root"' EXIT
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            state_worktree="${worktree_root}/state-${attempt}"
            git worktree add --detach "$state_worktree" "origin/${GITHUB_REF_NAME}"
            python "$state_worktree/scripts/phase-2/quota_state.py" aggregate --repo-root "$state_worktree" --events "$event_root"
            git -C "$state_worktree" add data/phase-2/quota-state.json data/phase-2/task-state.json
            if git -C "$state_worktree" diff --cached --quiet; then
              exit 0
            fi
            git -C "$state_worktree" config user.name "github-actions[bot]"
            git -C "$state_worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$state_worktree" commit -m "chore(phase-2): update diagnostic quota state"
            if git -C "$state_worktree" push "$push_url" HEAD:"${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git worktree remove --force "$state_worktree"
            [[ "$attempt" -lt 3 ]] || { echo "::error::Failed to persist diagnostic quota state."; exit 1; }
          done

  lease-and-plan:
    name: Reconcile, lease, and create provider plans
    if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'plan' || github.event.inputs.mode == 'simulate' || github.event.inputs.mode == 'post' }}
    runs-on: ubuntu-latest
    concurrency:
      group: phase-2-operational-state-write
      cancel-in-progress: false
    outputs:
      lease_sha: ${{ steps.scheduler.outputs.lease_sha }}
      has_sambanova: ${{ steps.scheduler.outputs.has_sambanova }}
      has_groq: ${{ steps.scheduler.outputs.has_groq }}
      has_gemini: ${{ steps.scheduler.outputs.has_gemini }}
      has_openrouter: ${{ steps.scheduler.outputs.has_openrouter }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate scheduler prerequisites
        run: |
          python scripts/phase-2/provider_model_registry.py validate
          python scripts/phase-2/provider_model_registry.py list-specs > /dev/null
          python scripts/phase-2/task_reconciler.py validate
          python scripts/phase-2/quota_state.py validate
          python -m py_compile scripts/phase-2/task_scheduler.py scripts/phase-2/provider_worker.py

      - name: Download recent worker result artifacts for lease recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/phase-2/recovery-events
          gh run list --workflow check-agent-signal-collector.yml --branch "$GITHUB_REF_NAME" --limit 20 --json databaseId --jq '.[].databaseId' | while read -r run_id; do
            [[ -n "$run_id" ]] || continue
            gh run download "$run_id" --pattern 'phase-2-worker-*' --dir ".tmp/phase-2/recovery-events/${run_id}" || true
          done

      - name: Check resolver priority
        id: resolver_preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE2_QUOTA_EVENT_DIR: .tmp/phase-2/recovery-quota-events
        run: |
          set -euo pipefail
          result="$(python scripts/phase-2/resolve_signal_issue.py --repo "$GITHUB_REPOSITORY" --preflight-only)"
          echo "$result"
          pending="$(printf '%s\n' "$result" | sed -n 's/^resolver_work_pending=//p' | tail -1)"
          [[ "$pending" == "true" || "$pending" == "false" ]] || { echo "::error::Invalid resolver preflight output."; exit 1; }
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

      - name: Reconcile and persist leases
        id: scheduler
        shell: bash
        env:
          PHASE2_AUTOMATION_TOKEN: ${{ secrets.PHASE2_AUTOMATION_TOKEN }}
          MODE_INPUT: ${{ github.event.inputs.mode }}
          PAGES_INPUT: ${{ github.event.inputs.pages }}
          AGENTS_INPUT: ${{ github.event.inputs.agents }}
          SPECS_INPUT: ${{ github.event.inputs.provider_model_specs }}
          MAX_TASKS_INPUT: ${{ github.event.inputs.max_tasks_per_provider }}
          EXECUTION_BUDGET_INPUT: ${{ github.event.inputs.execution_budget_seconds }}
          RESOLVER_WORK_PENDING: ${{ steps.resolver_preflight.outputs.pending }}
        run: |
          set -euo pipefail

          mode="${MODE_INPUT:-post}"
          [[ "${GITHUB_EVENT_NAME}" == "schedule" ]] && mode="post"
          scheduler_command="$mode"
          [[ "$mode" == "post" ]] && scheduler_command="lease"
          max_tasks="${MAX_TASKS_INPUT:-0}"
          execution_budget="${EXECUTION_BUDGET_INPUT:-720}"
          source_root="$PWD"
          worktree_root="$(mktemp -d)"
          push_url="https://x-access-token:${PHASE2_AUTOMATION_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          trap 'git worktree prune; rm -rf "$worktree_root"' EXIT

          filter_args=()
          while IFS= read -r page; do [[ -n "$page" ]] && filter_args+=(--page "$page"); done < <(printf '%s' "${PAGES_INPUT:-}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d')
          while IFS= read -r agent; do [[ -n "$agent" ]] && filter_args+=(--agent "$agent"); done < <(printf '%s' "${AGENTS_INPUT:-}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d')
          while IFS= read -r spec; do [[ -n "$spec" ]] && filter_args+=(--provider-model-spec "$spec"); done < <(printf '%s' "${SPECS_INPUT:-}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d')
          resolver_args=()
          [[ "$RESOLVER_WORK_PENDING" == "true" ]] && resolver_args+=(--resolver-work-pending)

          if [[ "$scheduler_command" == "lease" && -z "${PHASE2_AUTOMATION_TOKEN:-}" ]]; then
            echo "::error::Missing required repository secret: PHASE2_AUTOMATION_TOKEN"
            exit 1
          fi
          [[ -z "${PHASE2_AUTOMATION_TOKEN:-}" ]] || echo "::add-mask::${PHASE2_AUTOMATION_TOKEN}"

          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            state_worktree="${worktree_root}/state-${attempt}"
            git worktree add --detach "$state_worktree" "origin/${GITHUB_REF_NAME}"
            python "$state_worktree/scripts/phase-2/task_reconciler.py" reconcile --repo-root "$state_worktree" --commit-sha "$(git -C "$state_worktree" rev-parse HEAD)"
            plan_root="${state_worktree}/.tmp/phase-2/work-plans"
            python "$state_worktree/scripts/phase-2/task_scheduler.py" "$scheduler_command" \
              --repo-root "$state_worktree" \
              --workflow-run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --work-plan-root "$plan_root" \
              --result-events "${source_root}/.tmp/phase-2/recovery-events" \
              --max-tasks-per-provider "$max_tasks" \
              --execution-budget-seconds "$execution_budget" \
              "${resolver_args[@]}" \
              "${filter_args[@]}"

            if [[ "$scheduler_command" != "lease" ]]; then
              lease_sha="$(git -C "$state_worktree" rev-parse HEAD)"
              mkdir -p "$source_root/.tmp/phase-2/work-plans"
              cp "$plan_root"/*.json "$source_root/.tmp/phase-2/work-plans/"
              python "$source_root/scripts/phase-2/task_scheduler.py" stamp-plans --work-plan-root "$source_root/.tmp/phase-2/work-plans" --lease-commit-sha "$lease_sha"
              break
            fi

            git -C "$state_worktree" add data/phase-2/task-state.json data/phase-2/quota-state.json
            git -C "$state_worktree" config user.name "github-actions[bot]"
            git -C "$state_worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git -C "$state_worktree" diff --cached --quiet; then
              git -C "$state_worktree" commit -m "chore(phase-2): lease scheduled provider work"
              if ! git -C "$state_worktree" push "$push_url" HEAD:"${GITHUB_REF_NAME}"; then
                git worktree remove --force "$state_worktree"
                [[ "$attempt" -lt 3 ]] || { echo "::error::Lease push conflicted after three fresh selections."; exit 1; }
                echo "::warning::Lease push conflicted; reconciling and reselecting from the latest branch state."
                continue
              fi
            fi
            lease_sha="$(git -C "$state_worktree" rev-parse HEAD)"
            mkdir -p "$source_root/.tmp/phase-2/work-plans"
            cp "$plan_root"/*.json "$source_root/.tmp/phase-2/work-plans/"
            python "$source_root/scripts/phase-2/task_scheduler.py" stamp-plans --work-plan-root "$source_root/.tmp/phase-2/work-plans" --lease-commit-sha "$lease_sha"
            break
          done

          echo "lease_sha=$lease_sha" >> "$GITHUB_OUTPUT"
          for provider in sambanova groq gemini openrouter; do
            count="$(jq '.assignments | length' ".tmp/phase-2/work-plans/${provider}.json")"
            [[ "$count" -gt 0 ]] && has_work=true || has_work=false
            echo "has_${provider}=${has_work}" >> "$GITHUB_OUTPUT"
          done

      - name: Upload provider work plans
        uses: actions/upload-artifact@v7
        with:
          name: phase-2-provider-work-plans-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/phase-2/work-plans
          if-no-files-found: error

  sambanova-worker:
    name: SambaNova provider worker
    needs: lease-and-plan
    if: ${{ needs.lease-and-plan.result == 'success' && needs.lease-and-plan.outputs.has_sambanova == 'true' && (github.event_name == 'schedule' || github.event.inputs.mode == 'post') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.lease-and-plan.outputs.lease_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: phase-2-provider-work-plans-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/phase-2/work-plans
      - name: Run SambaNova assignments
        env:
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          PHASE2_QUOTA_EVENT_DIR: .tmp/phase-2/quota-events
        run: python scripts/phase-2/provider_worker.py --provider sambanova --plan .tmp/phase-2/work-plans/sambanova.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-2-worker-sambanova-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/phase-2/result-events
            .tmp/phase-2/quota-events
            .tmp/phase-2/worker-output
          if-no-files-found: warn

  groq-worker:
    name: Groq provider worker
    needs: lease-and-plan
    if: ${{ needs.lease-and-plan.result == 'success' && needs.lease-and-plan.outputs.has_groq == 'true' && (github.event_name == 'schedule' || github.event.inputs.mode == 'post') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.lease-and-plan.outputs.lease_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: phase-2-provider-work-plans-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/phase-2/work-plans
      - name: Run Groq assignments
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PHASE2_QUOTA_EVENT_DIR: .tmp/phase-2/quota-events
        run: python scripts/phase-2/provider_worker.py --provider groq --plan .tmp/phase-2/work-plans/groq.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-2-worker-groq-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/phase-2/result-events
            .tmp/phase-2/quota-events
            .tmp/phase-2/worker-output
          if-no-files-found: warn

  gemini-worker:
    name: Gemini provider worker
    needs: lease-and-plan
    if: ${{ needs.lease-and-plan.result == 'success' && needs.lease-and-plan.outputs.has_gemini == 'true' && (github.event_name == 'schedule' || github.event.inputs.mode == 'post') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.lease-and-plan.outputs.lease_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: phase-2-provider-work-plans-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/phase-2/work-plans
      - name: Run Gemini assignments
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PHASE2_QUOTA_EVENT_DIR: .tmp/phase-2/quota-events
        run: python scripts/phase-2/provider_worker.py --provider gemini --plan .tmp/phase-2/work-plans/gemini.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-2-worker-gemini-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/phase-2/result-events
            .tmp/phase-2/quota-events
            .tmp/phase-2/worker-output
          if-no-files-found: warn

  openrouter-worker:
    name: OpenRouter provider worker
    needs: lease-and-plan
    if: ${{ needs.lease-and-plan.result == 'success' && needs.lease-and-plan.outputs.has_openrouter == 'true' && (github.event_name == 'schedule' || github.event.inputs.mode == 'post') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.lease-and-plan.outputs.lease_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: phase-2-provider-work-plans-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/phase-2/work-plans
      - name: Run OpenRouter assignments
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PHASE2_QUOTA_EVENT_DIR: .tmp/phase-2/quota-events
        run: python scripts/phase-2/provider_worker.py --provider openrouter --plan .tmp/phase-2/work-plans/openrouter.json
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-2-worker-openrouter-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/phase-2/result-events
            .tmp/phase-2/quota-events
            .tmp/phase-2/worker-output
          if-no-files-found: warn
