name: Dependabot auto-merge

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest

    if: >
      github.repository == 'pedropaulofb/ontouml-according-to-the-machines' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')

    steps:
      - name: Validate changed files
        shell: bash
        run: |
          set -euo pipefail

          gh pr diff "$PR_URL" --name-only > changed-files.txt

          echo "Changed files:"
          cat changed-files.txt

          unexpected_files="$(
            grep -Ev '^requirements(-dev)?\.txt$|^\.github/workflows/[^/]+\.ya?ml$' changed-files.txt || true
          )"

          if [[ -n "$unexpected_files" ]]; then
            echo "::error::Unexpected files in Dependabot PR:"
            echo "$unexpected_files"
            exit 1
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for Dependabot PR
        run: >
          gh pr merge "$PR_URL"
          --auto
          --squash
          --delete-branch
          --match-head-commit "$HEAD_SHA"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
