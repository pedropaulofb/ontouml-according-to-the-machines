name: Automated signal resolver

on:
  schedule:
    # Six scheduled attempts per UTC day, every four hours.
    - cron: "5 */4 * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number or URL to resolve. Leave empty to resolve the oldest eligible open issue."
        required: false
        type: string
      provider:
        description: "LLM provider"
        required: false
        default: "gemini"
        type: choice
        options:
          - gemini
          - groq
      model:
        description: "Provider model"
        required: false
        default: "gemini-3.5-flash"
        type: string
      fallback_model:
        description: "Fallback Gemini model used once when the primary Gemini model fails with provider unavailability."
        required: false
        default: "gemini-2.5-flash"
        type: string
      dry_run:
        description: "Generate and validate the resolution plan without GitHub writes"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: phase-2-automated-signal-resolver
  cancel-in-progress: false

jobs:
  resolve-signal-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PHASE2_AUTOMATION_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve signal issue
        env:
          GH_TOKEN: ${{ secrets.PHASE2_AUTOMATION_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PHASE2_AUTOMATION_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_INPUT: ${{ github.event.inputs.issue }}
          PROVIDER_INPUT: ${{ github.event.inputs.provider }}
          MODEL_INPUT: ${{ github.event.inputs.model }}
          FALLBACK_MODEL_INPUT: ${{ github.event.inputs.fallback_model }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          provider="${PROVIDER_INPUT:-gemini}"
          model="${MODEL_INPUT:-gemini-3.5-flash}"
          fallback_model="${FALLBACK_MODEL_INPUT:-gemini-2.5-flash}"

          run_resolver() {
            local run_provider="$1"
            local run_model="$2"
            local run_issue="${3:-${ISSUE_INPUT:-}}"

            local run_args=(
              --repo "${{ github.repository }}"
              --provider "$run_provider"
              --model "$run_model"
            )

            if [[ -n "$run_issue" ]]; then
              run_args+=(--issue "$run_issue")
            fi

            if [[ "${DRY_RUN_INPUT:-false}" == "true" ]]; then
              run_args+=(--dry-run)
            fi

            python scripts/phase-2/resolve_signal_issue.py "${run_args[@]}" --provider-max-attempts 1
          }

          provider_unavailable_issue_number() {
            local output_dir=".tmp/phase-2/resolver"
            local marker_pattern="503|ServiceUnavailable|service_unavailable|provider_unavailable|status.*unavailable|temporarily unavailable"

            [[ -d "$output_dir" ]] || return 1

            local error_file
            for error_file in "$output_dir"/issue-*-provider-error.txt; do
              [[ -e "$error_file" ]] || continue
              if grep -qiE "$marker_pattern" "$error_file"; then
                local filename
                local issue_number
                filename="$(basename "$error_file")"
                issue_number="${filename#issue-}"
                issue_number="${issue_number%-provider-error.txt}"
                if [[ "$issue_number" =~ ^[0-9]+$ ]]; then
                  printf '%s\n' "$issue_number"
                  return 0
                fi
              fi
            done

            return 1
          }

          preserve_primary_provider_error_artifacts() {
            local output_dir=".tmp/phase-2/resolver"
            local error_file
            for error_file in "$output_dir"/issue-*-provider-error.txt; do
              [[ -e "$error_file" ]] || continue
              cp "$error_file" "${error_file%-provider-error.txt}-primary-provider-error.txt"
              rm -f "$error_file"
            done
          }

          rm -rf .tmp/phase-2/resolver

          if run_resolver "$provider" "$model"; then
            exit 0
          fi

          fallback_issue=""
          if [[ "$provider" == "gemini" && "$model" != "$fallback_model" ]] && fallback_issue="$(provider_unavailable_issue_number)"; then
            echo "::warning::Primary Gemini resolver model failed with provider unavailability. Running fallback model once: ${fallback_model}"
            preserve_primary_provider_error_artifacts
            run_resolver "gemini" "$fallback_model" "${ISSUE_INPUT:-$fallback_issue}"
          else
            exit 1
          fi

      - name: Upload resolver plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-2-resolver-plan
          path: .tmp/phase-2/resolver
          if-no-files-found: ignore
