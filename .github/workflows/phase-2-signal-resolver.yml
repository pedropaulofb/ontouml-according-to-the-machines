name: Automated signal resolver

on:
  schedule:
    # Six scheduled attempts per UTC day, every four hours.
    - cron: "5 */4 * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number or URL to resolve. Leave empty to resolve the oldest eligible open issue."
        required: false
        type: string
      provider:
        description: "LLM provider"
        required: false
        default: "gemini"
        type: choice
        options:
          - gemini
          - groq
      model:
        description: "Provider model"
        required: false
        default: "gemini-3.5-flash"
        type: string
      dry_run:
        description: "Generate and validate the resolution plan without GitHub writes"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: phase-2-operational-state-write
  cancel-in-progress: false

jobs:
  resolve-signal-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PHASE2_AUTOMATION_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Repair legacy provider runtime blocks
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        env:
          PHASE2_AUTOMATION_TOKEN: ${{ secrets.PHASE2_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${PHASE2_AUTOMATION_TOKEN:-}" ]]; then
            echo "::error::Missing required repository secret: PHASE2_AUTOMATION_TOKEN"
            exit 1
          fi
          echo "::add-mask::${PHASE2_AUTOMATION_TOKEN}"

          source_root="$PWD"
          export PHASE2_PUSH_URL="https://x-access-token:${PHASE2_AUTOMATION_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          python scripts/phase-2/state_writer.py \
            --repo-root "$source_root" \
            --branch "$GITHUB_REF_NAME" \
            --commit-message "chore(phase-2): repair legacy provider runtime blocks" \
            --add data/phase-2/quota-state.json \
            --add data/phase-2/task-state.json \
            --export "data/phase-2/quota-state.json=${source_root}/data/phase-2/quota-state.json" \
            --export "data/phase-2/task-state.json=${source_root}/data/phase-2/task-state.json" \
            -- \
            python "{worktree}/scripts/phase-2/repair_legacy_provider_blocks.py" \
            --state "{worktree}/data/phase-2/quota-state.json" \
            --task-state "{worktree}/data/phase-2/task-state.json"

      - name: Resolve signal issue
        env:
          GH_TOKEN: ${{ secrets.PHASE2_AUTOMATION_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PHASE2_AUTOMATION_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_INPUT: ${{ github.event.inputs.issue }}
          PROVIDER_INPUT: ${{ github.event.inputs.provider }}
          MODEL_INPUT: ${{ github.event.inputs.model }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          PHASE2_QUOTA_EVENT_DIR: .tmp/phase-2/quota-events
          PHASE2_RESOLVER_ATTEMPT_EVENT_DIR: .tmp/phase-2/resolver-attempt-events
        run: |
          set -euo pipefail

          provider="${PROVIDER_INPUT:-gemini}"
          model="${MODEL_INPUT:-gemini-3.5-flash}"
          fallback_provider="gemini"
          fallback_model="gemini-3.6-flash"
          fallback_max_completion_tokens="6000"
          dry_run="${DRY_RUN_INPUT:-false}"
          issue_label="${ISSUE_INPUT:-oldest eligible open issue}"

          echo "::group::Resolver execution configuration"
          echo "Provider: ${provider}"
          echo "Primary model: ${model}"
          echo "Fallback provider: ${fallback_provider}"
          echo "Fallback model: ${fallback_model}"
          echo "Fallback max completion tokens: ${fallback_max_completion_tokens}"
          echo "Issue target: ${issue_label}"
          echo "Dry run: ${dry_run}"
          echo "Repository: ${{ github.repository }}"
          echo "Workflow event: ${GITHUB_EVENT_NAME}"
          echo "::endgroup::"

          echo "::notice::Resolver configured with provider=${provider}; primary_model=${model}; fallback_provider=${fallback_provider}; fallback_model=${fallback_model}; issue=${issue_label}; dry_run=${dry_run}"

          run_resolver() {
            local run_provider="$1"
            local run_model="$2"
            local run_issue="${3:-${ISSUE_INPUT:-}}"
            local run_label="${4:-primary}"
            local run_max_completion_tokens="${5:-8000}"
            local run_fallback_used="${6:-false}"

            local run_issue_label="oldest eligible open issue"
            if [[ -n "$run_issue" ]]; then
              run_issue_label="$run_issue"
            fi

            echo "::notice::Running ${run_label} resolver attempt: provider=${run_provider}; model=${run_model}; max_completion_tokens=${run_max_completion_tokens}; issue=${run_issue_label}; dry_run=${dry_run}"

            local run_args=(
              --repo "${{ github.repository }}"
              --provider "$run_provider"
              --model "$run_model"
              --max-completion-tokens "$run_max_completion_tokens"
            )

            if [[ -n "$run_issue" ]]; then
              run_args+=(--issue "$run_issue")
            fi

            if [[ "$dry_run" == "true" ]]; then
              run_args+=(--dry-run)
            fi

            if [[ "$run_fallback_used" == "true" ]]; then
              run_args+=(--fallback-used)
            fi

            rm -f .tmp/phase-2/resolver/outcome.json
            PHASE2_CALL_SOURCE="resolver-${run_label}" \
              python scripts/phase-2/resolve_signal_issue.py "${run_args[@]}" --provider-max-attempts 1
          }

          require_outcome() {
            local outcome_file="$1"
            [[ -f "$outcome_file" ]] || { echo "::error::Resolver did not emit its structured outcome."; return 1; }
            jq -e '
              .schema_version == 1 and
              (.outcome | IN("completed_changes", "completed_no_changes", "no_candidate", "deferred", "failed")) and
              (.candidate_exists | type == "boolean") and
              (.request_sent | type == "boolean") and
              (.fallback_executable | type == "boolean") and
              (.issue_resolved | type == "boolean")
            ' "$outcome_file" > /dev/null
          }

          append_outcome_summary() {
            local outcome_file="$1"
            local label="$2"
            {
              echo "### Phase 2 resolver ${label} outcome"
              echo
              echo "| Field | Value |"
              echo "|---|---|"
              echo "| Resolver outcome | $(jq -r '.outcome' "$outcome_file") |"
              echo "| Candidate issue | $(jq -r '.issue_number // "none"' "$outcome_file") |"
              echo "| Provider/model | $(jq -r '(.provider + ":" + .model)' "$outcome_file") |"
              echo "| Provider request sent | $(jq -r '.request_sent' "$outcome_file") |"
              echo "| Reason code | $(jq -r '.reason_code // "none"' "$outcome_file") |"
              echo "| Fallback used | $(jq -r '.fallback_used' "$outcome_file") |"
              echo "| Fallback executable | $(jq -r '.fallback_executable' "$outcome_file") |"
              echo "| Issue resolved | $(jq -r '.issue_resolved' "$outcome_file") |"
              echo "| PR created or reused | $(jq -r '.pr_url // "none"' "$outcome_file") |"
              echo "| Next eligible retry | $(jq -r '.retry_not_before // "none"' "$outcome_file") |"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          }

          preserve_primary_provider_error_artifacts() {
            local output_dir=".tmp/phase-2/resolver"
            local error_file
            for error_file in "$output_dir"/issue-*-provider-error.txt; do
              [[ -e "$error_file" ]] || continue
              cp "$error_file" "${error_file%-provider-error.txt}-primary-provider-error.txt"
            done
          }

          rm -rf .tmp/phase-2/resolver

          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            preflight_args=(
              --repo "${{ github.repository }}"
              --preflight-only
            )
            if [[ -n "${ISSUE_INPUT:-}" ]]; then
              preflight_args+=(--issue "${ISSUE_INPUT}")
            fi
            preflight_output="$(python scripts/phase-2/resolve_signal_issue.py "${preflight_args[@]}")"
            printf '%s\n' "$preflight_output"
            candidate="$(printf '%s\n' "$preflight_output" | sed -n 's/^resolver_candidate_exists=//p' | tail -1)"
            executable="$(printf '%s\n' "$preflight_output" | sed -n 's/^resolver_executable_now=//p' | tail -1)"
            capacity_required="$(printf '%s\n' "$preflight_output" | sed -n 's/^resolver_capacity_required=//p' | tail -1)"
            fallback_executable="$(printf '%s\n' "$preflight_output" | sed -n 's/^resolver_fallback_executable=//p' | tail -1)"
            issue_number="$(printf '%s\n' "$preflight_output" | sed -n 's/^resolver_issue_number=//p' | tail -1)"
            reason_codes="$(printf '%s\n' "$preflight_output" | sed -n 's/^resolver_reason_codes=//p' | tail -1)"
            retry_not_before="$(printf '%s\n' "$preflight_output" | sed -n 's/^resolver_retry_not_before=//p' | tail -1)"
            [[ "$candidate" == "true" || "$candidate" == "false" ]] || { echo "::error::Invalid resolver candidate preflight output."; exit 1; }
            [[ "$executable" == "true" || "$executable" == "false" ]] || { echo "::error::Invalid resolver execution preflight output."; exit 1; }
            [[ "$capacity_required" == "true" || "$capacity_required" == "false" ]] || { echo "::error::Invalid resolver capacity preflight output."; exit 1; }
            [[ "$fallback_executable" == "true" || "$fallback_executable" == "false" ]] || { echo "::error::Invalid resolver fallback preflight output."; exit 1; }
            if [[ "$executable" == "false" ]]; then
              preflight_outcome="no_candidate"
              [[ "$candidate" == "true" ]] && preflight_outcome="deferred"
              {
                echo "### Phase 2 resolver preflight"
                echo
                echo "| Field | Value |"
                echo "|---|---|"
                echo "| Resolver outcome | ${preflight_outcome} |"
                echo "| Candidate exists | ${candidate} |"
                echo "| Candidate issue | ${issue_number:-none} |"
                echo "| Executable now | ${executable} |"
                echo "| Capacity required | ${capacity_required} |"
                echo "| Provider/model | ${provider}:${model} |"
                echo "| Provider request sent | false |"
                echo "| Reason code | ${reason_codes:-none} |"
                echo "| Fallback used | false |"
                echo "| Fallback executable | ${fallback_executable} |"
                echo "| Issue resolved | false |"
                echo "| PR created or reused | none |"
                echo "| Next eligible retry | ${retry_not_before:-none} |"
              } >> "$GITHUB_STEP_SUMMARY"
              if [[ "$candidate" == "true" ]]; then
                echo "::warning::Scheduled resolver deferred with unresolved candidate #${issue_number:-unknown}: reasons=${reason_codes:-unknown}; retry_not_before=${retry_not_before:-none}."
              else
                echo "::notice::Scheduled resolver idle: no active resolver candidate exists."
              fi
              exit 0
            fi
          fi

          primary_exit_code=0
          if run_resolver "$provider" "$model" "${ISSUE_INPUT:-}" "primary" "8000"; then
            primary_exit_code=0
          else
            primary_exit_code=$?
          fi
          outcome_file=".tmp/phase-2/resolver/outcome.json"
          require_outcome "$outcome_file"
          append_outcome_summary "$outcome_file" "primary"
          primary_outcome="$(jq -r '.outcome' "$outcome_file")"
          primary_request_sent="$(jq -r '.request_sent' "$outcome_file")"
          fallback_executable="$(jq -r '.fallback_executable' "$outcome_file")"
          fallback_issue="$(jq -r '.issue_number // empty' "$outcome_file")"

          case "$primary_outcome" in
            completed_changes|completed_no_changes)
              echo "::notice::Primary resolver completed: outcome=${primary_outcome}; provider=${provider}; model=${model}; fallback_used=false"
              exit 0
              ;;
            no_candidate)
              echo "::notice::Resolver idle: no active candidate exists."
              exit 0
              ;;
            failed)
              echo "::error::Primary resolver failed: provider=${provider}; model=${model}."
              [[ "$primary_exit_code" -ne 0 ]] && exit "$primary_exit_code" || exit 1
              ;;
            deferred)
              ;;
          esac

          if [[ "$fallback_executable" != "true" ]]; then
            if [[ "$dry_run" == "true" ]]; then
              echo "::notice::Resolver dry run completed without resolving the issue."
            else
              echo "::warning::Resolver deferred without completing resolution; issue=${fallback_issue:-none}; request_sent=${primary_request_sent}."
            fi
            exit 0
          fi
          if [[ "$provider" != "gemini" || "$provider" == "$fallback_provider" && "$model" == "$fallback_model" ]]; then
            echo "::error::Structured outcome requested a fallback for an unsupported primary provider/model."
            exit 1
          fi
          [[ "$fallback_issue" =~ ^[0-9]+$ ]] || { echo "::error::Fallback outcome did not identify a candidate issue."; exit 1; }

          echo "::warning::Primary resolution deferred for issue #${fallback_issue}. Running eligible Gemini fallback once: ${fallback_model}"
          cp "$outcome_file" .tmp/phase-2/resolver/primary-outcome.json
          preserve_primary_provider_error_artifacts
          fallback_exit_code=0
          if run_resolver "$fallback_provider" "$fallback_model" "$fallback_issue" "fallback" "$fallback_max_completion_tokens" "true"; then
            fallback_exit_code=0
          else
            fallback_exit_code=$?
          fi
          require_outcome "$outcome_file"
          append_outcome_summary "$outcome_file" "fallback"
          fallback_outcome="$(jq -r '.outcome' "$outcome_file")"
          case "$fallback_outcome" in
            completed_changes|completed_no_changes)
              echo "::notice::Fallback resolver completed: outcome=${fallback_outcome}; provider=${fallback_provider}; model=${fallback_model}; issue=${fallback_issue}"
              exit 0
              ;;
            no_candidate|deferred)
              echo "::warning::Fallback resolver did not complete a resolution: outcome=${fallback_outcome}; provider=${fallback_provider}; model=${fallback_model}; issue=${fallback_issue}"
              exit 0
              ;;
            failed)
              echo "::error::Fallback resolver failed: provider=${fallback_provider}; model=${fallback_model}; issue=${fallback_issue}"
              [[ "$fallback_exit_code" -ne 0 ]] && exit "$fallback_exit_code" || exit 1
              ;;
          esac

      - name: Persist resolver quota state
        if: always()
        env:
          PHASE2_AUTOMATION_TOKEN: ${{ secrets.PHASE2_AUTOMATION_TOKEN }}
          PHASE2_QUOTA_EVENT_DIR: .tmp/phase-2/quota-events
          PHASE2_RESOLVER_ATTEMPT_EVENT_DIR: .tmp/phase-2/resolver-attempt-events
        run: |
          set -euo pipefail

          if ! compgen -G "${PHASE2_QUOTA_EVENT_DIR}/*.json" > /dev/null \
            && ! compgen -G "${PHASE2_RESOLVER_ATTEMPT_EVENT_DIR}/*.json" > /dev/null; then
            echo "No resolver quota or attempt events found; operational state is unchanged."
            exit 0
          fi
          if [[ -z "${PHASE2_AUTOMATION_TOKEN:-}" ]]; then
            echo "::error::Missing required repository secret: PHASE2_AUTOMATION_TOKEN"
            exit 1
          fi
          echo "::add-mask::${PHASE2_AUTOMATION_TOKEN}"

          source_root="$PWD"
          export PHASE2_PUSH_URL="https://x-access-token:${PHASE2_AUTOMATION_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          python scripts/phase-2/state_writer.py \
            --repo-root "$source_root" \
            --branch "$GITHUB_REF_NAME" \
            --commit-message "chore(phase-2): update resolver quota state" \
            --add data/phase-2/quota-state.json \
            --add data/phase-2/task-state.json \
            --add data/phase-2/resolver-attempt-state.json \
            -- \
            python "{worktree}/scripts/phase-2/quota_state.py" aggregate \
            --repo-root "{worktree}" \
            --events "${source_root}/${PHASE2_QUOTA_EVENT_DIR}" \
            --resolver-attempt-state data/phase-2/resolver-attempt-state.json \
            --resolver-attempt-events "${source_root}/${PHASE2_RESOLVER_ATTEMPT_EVENT_DIR}"

      - name: Upload resolver plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-2-resolver-plan
          path: |
            .tmp/phase-2/resolver
            .tmp/phase-2/quota-events
            .tmp/phase-2/resolver-attempt-events
          if-no-files-found: ignore
