name: Automated signal resolver

on:
  schedule:
    # Six scheduled attempts per UTC day, every four hours.
    - cron: "5 */4 * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number or URL to resolve. Leave empty to resolve the oldest eligible open issue."
        required: false
        type: string
      provider:
        description: "LLM provider"
        required: false
        default: "gemini"
        type: choice
        options:
          - gemini
          - groq
      model:
        description: "Provider model"
        required: false
        default: "gemini-3.5-flash"
        type: string
      dry_run:
        description: "Generate and validate the resolution plan without GitHub writes"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: phase-2-automated-signal-resolver
  cancel-in-progress: false

jobs:
  resolve-signal-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PHASE2_AUTOMATION_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve signal issue
        env:
          GH_TOKEN: ${{ secrets.PHASE2_AUTOMATION_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PHASE2_AUTOMATION_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_INPUT: ${{ github.event.inputs.issue }}
          PROVIDER_INPUT: ${{ github.event.inputs.provider }}
          MODEL_INPUT: ${{ github.event.inputs.model }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          provider="${PROVIDER_INPUT:-gemini}"
          model="${MODEL_INPUT:-gemini-3.5-flash}"
          fallback_provider="groq"
          fallback_model="openai/gpt-oss-120b"
          fallback_max_completion_tokens="6000"
          dry_run="${DRY_RUN_INPUT:-false}"
          issue_label="${ISSUE_INPUT:-oldest eligible open issue}"

          echo "::group::Resolver execution configuration"
          echo "Provider: ${provider}"
          echo "Primary model: ${model}"
          echo "Fallback provider: ${fallback_provider}"
          echo "Fallback model: ${fallback_model}"
          echo "Fallback max completion tokens: ${fallback_max_completion_tokens}"
          echo "Issue target: ${issue_label}"
          echo "Dry run: ${dry_run}"
          echo "Repository: ${{ github.repository }}"
          echo "Workflow event: ${GITHUB_EVENT_NAME}"
          echo "::endgroup::"

          echo "::notice::Resolver configured with provider=${provider}; primary_model=${model}; fallback_provider=${fallback_provider}; fallback_model=${fallback_model}; issue=${issue_label}; dry_run=${dry_run}"

          run_resolver() {
            local run_provider="$1"
            local run_model="$2"
            local run_issue="${3:-${ISSUE_INPUT:-}}"
            local run_label="${4:-primary}"
            local run_max_completion_tokens="${5:-8000}"

            local run_issue_label="oldest eligible open issue"
            if [[ -n "$run_issue" ]]; then
              run_issue_label="$run_issue"
            fi

            echo "::notice::Running ${run_label} resolver attempt: provider=${run_provider}; model=${run_model}; max_completion_tokens=${run_max_completion_tokens}; issue=${run_issue_label}; dry_run=${dry_run}"

            local run_args=(
              --repo "${{ github.repository }}"
              --provider "$run_provider"
              --model "$run_model"
              --max-completion-tokens "$run_max_completion_tokens"
            )

            if [[ -n "$run_issue" ]]; then
              run_args+=(--issue "$run_issue")
            fi

            if [[ "$dry_run" == "true" ]]; then
              run_args+=(--dry-run)
            fi

            python scripts/phase-2/resolve_signal_issue.py "${run_args[@]}" --provider-max-attempts 1
          }

          provider_unavailable_issue_number() {
            local output_dir=".tmp/phase-2/resolver"
            local marker_pattern="503|ServiceUnavailable|service_unavailable|provider_unavailable|status.*unavailable|temporarily unavailable|server disconnected|disconnected without sending a response"

            [[ -d "$output_dir" ]] || return 1

            local error_file
            for error_file in "$output_dir"/issue-*-provider-error.txt; do
              [[ -e "$error_file" ]] || continue
              if grep -qiE "$marker_pattern" "$error_file"; then
                local filename
                local issue_number
                filename="$(basename "$error_file")"
                issue_number="${filename#issue-}"
                issue_number="${issue_number%-provider-error.txt}"
                if [[ "$issue_number" =~ ^[0-9]+$ ]]; then
                  printf '%s\n' "$issue_number"
                  return 0
                fi
              fi
            done

            return 1
          }

          preserve_primary_provider_error_artifacts() {
            local output_dir=".tmp/phase-2/resolver"
            local preserved_count=0
            local error_file

            for error_file in "$output_dir"/issue-*-provider-error.txt; do
              [[ -e "$error_file" ]] || continue
              cp "$error_file" "${error_file%-provider-error.txt}-primary-provider-error.txt"
              rm -f "$error_file"
              preserved_count=$((preserved_count + 1))
            done

            echo "::notice::Preserved ${preserved_count} primary provider-error artifact(s) for post-run inspection."
          }

          rm -rf .tmp/phase-2/resolver

          if run_resolver "$provider" "$model" "${ISSUE_INPUT:-}" "primary" "8000"; then
            echo "::notice::Primary resolver attempt succeeded: provider=${provider}; model=${model}; fallback_used=false"
            exit 0
          else
            primary_exit_code=$?
            echo "::warning::Primary resolver attempt failed with exit code ${primary_exit_code}: provider=${provider}; model=${model}. Checking fallback eligibility."
          fi

          fallback_issue=""

          if [[ "$provider" != "gemini" ]]; then
            echo "::error::Fallback skipped: provider=${provider}; cross-provider fallback is only configured for primary Gemini resolver runs."
            exit "$primary_exit_code"
          fi

          if ! fallback_issue="$(provider_unavailable_issue_number)"; then
            echo "::error::Fallback skipped: primary failure did not match provider-unavailability markers, or no provider-error artifact was produced."
            exit "$primary_exit_code"
          fi

          echo "::warning::Primary Gemini resolver model failed with provider unavailability for issue #${fallback_issue}. Running Groq fallback once: ${fallback_model}"
          preserve_primary_provider_error_artifacts

          if run_resolver "$fallback_provider" "$fallback_model" "${ISSUE_INPUT:-$fallback_issue}" "fallback" "$fallback_max_completion_tokens"; then
            echo "::notice::Fallback resolver attempt succeeded: provider=${fallback_provider}; model=${fallback_model}; fallback_used=true; issue=${ISSUE_INPUT:-$fallback_issue}"
            exit 0
          else
            fallback_exit_code=$?
            echo "::error::Fallback resolver attempt failed with exit code ${fallback_exit_code}: provider=${fallback_provider}; model=${fallback_model}; issue=${ISSUE_INPUT:-$fallback_issue}"
            exit "$fallback_exit_code"
          fi

      - name: Upload resolver plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-2-resolver-plan
          path: .tmp/phase-2/resolver
          if-no-files-found: ignore
