name: Pre-commit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: Run pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run pre-commit hooks
        shell: bash
        run: |
          set -euo pipefail
          pre-commit run --all-files --show-diff-on-failure

      - name: Run manual documentation build hook
        shell: bash
        run: |
          set -euo pipefail
          pre-commit run mkdocs-build-strict --all-files --hook-stage manual --show-diff-on-failure
